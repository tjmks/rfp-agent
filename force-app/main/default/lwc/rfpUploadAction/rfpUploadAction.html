<template>
    <div class="upload-container">
        <template if:false={isDone}>
            <div class="header">
                <img src={agentforceGuyUrl} alt="Agentforce" class="agentforce-icon" />
                <h1 class="header-title">Process RFP</h1>
                <p class="header-subtitle">Let Agentforce extract the answers from every source file.</p>
            </div>

            <div class="corpus-note slds-m-bottom_medium">
                <lightning-icon icon-name="utility:info" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                <span>All supported files already attached to this RFP are included. Uploading adds files to that record-bound corpus.</span>
            </div>

            <!-- Keep the control visible so users can add more files in several selections. -->
            <div class="slds-form-element slds-m-bottom_medium upload-step">
                <lightning-file-upload
                    label="Add source files"
                    name="rfpUpload"
                    accept={acceptedFileExtensions}
                    record-id={contextRecordId}
                    onuploadfinished={handleUploadFinished}
                    multiple>
                </lightning-file-upload>
                <p class="slds-form-element__help slds-text-color_weak slds-m-top_xx-small">
                    Supported formats: PDF, PNG, JPEG, and JPG. You can select multiple files.
                </p>
            </div>

            <template if:true={hasExistingFiles}>
                <section class="file-section slds-m-bottom_medium" aria-label="Files already attached to this RFP">
                    <div class="file-section__heading">
                        <span class="slds-text-title_bold">Already attached</span>
                        <span class="slds-text-body_small slds-text-color_weak">Included automatically</span>
                    </div>
                    <ul class="file-list">
                        <template for:each={existingFiles} for:item="file">
                            <li key={file.documentId} class="file-row">
                                <lightning-icon icon-name={file.iconName} size="small" class="slds-m-right_x-small"></lightning-icon>
                                <span class="file-name">{file.displayName}</span>
                                <template if:false={file.supported}>
                                    <span class="unsupported-badge">Excluded: {file.exclusionReason}</span>
                                </template>
                            </li>
                        </template>
                    </ul>
                </section>
            </template>

            <template if:true={hasUploadedFiles}>
                <section class="file-section slds-m-bottom_medium" aria-label="Files added in this upload session">
                    <div class="file-section__heading">
                        <span class="slds-text-title_bold">Added in this session</span>
                        <span class="slds-text-body_small slds-text-color_weak">{uploadedFileCountLabel}</span>
                    </div>
                    <ul class="file-list">
                        <template for:each={uploadedFiles} for:item="file">
                            <li key={file.documentId} class="file-row">
                                <lightning-icon icon-name={file.iconName} size="small" class="slds-m-right_x-small"></lightning-icon>
                                <span class="file-name">{file.displayName}</span>
                                <template if:false={file.supported}>
                                    <span class="unsupported-badge">Excluded: {file.exclusionReason}</span>
                                </template>
                                <button
                                    class="slds-button slds-button_icon slds-m-left_x-small remove-button"
                                    title="Remove from this session"
                                    data-document-id={file.documentId}
                                    onclick={handleRemoveFile}
                                    disabled={isBusy}>
                                    <lightning-icon icon-name="utility:close" size="xx-small"></lightning-icon>
                                    <span class="slds-assistive-text">Remove {file.displayName}</span>
                                </button>
                            </li>
                        </template>
                    </ul>
                </section>
            </template>

            <template if:true={hasUnsupportedFiles}>
                <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_medium" role="status">
                    <lightning-icon icon-name="utility:warning" size="small" class="slds-m-right_x-small"></lightning-icon>
                    <span>Unsupported files remain visible for transparency but are excluded from Prompt Builder grounding.</span>
                </div>
            </template>

            <template if:true={showConfiguration}>
                <p class="file-count slds-m-bottom_medium">{fileCountLabel}</p>

                <div class="slds-form-element slds-m-bottom_medium">
                    <label class="slds-form-element__label" for="profileSelect">
                        <abbr class="slds-required" title="required">*</abbr>
                        Extraction Profile
                    </label>
                    <div class="slds-form-element__control">
                        <lightning-combobox
                            name="profileSelect"
                            placeholder="Select a profile…"
                            value={selectedProfileId}
                            options={profileOptions}
                            onchange={handleProfileChange}
                            required>
                        </lightning-combobox>
                    </div>
                    <p class="slds-form-element__help slds-text-color_weak slds-m-top_xx-small">
                        The profile defines which fields will be extracted from the complete source-document corpus.
                    </p>
                </div>

                <div class="slds-form-element slds-m-bottom_medium">
                    <lightning-record-picker
                        label={accountFieldLabel}
                        placeholder="Search accounts…"
                        object-api-name="Account"
                        value={accountId}
                        onchange={handleAccountChange}>
                    </lightning-record-picker>
                </div>

                <div class="slds-form-element slds-m-bottom_medium">
                    <lightning-record-picker
                        label={opportunityFieldLabel}
                        placeholder="Search opportunities…"
                        object-api-name="Opportunity"
                        value={opportunityId}
                        onchange={handleOpportunityChange}>
                    </lightning-record-picker>
                </div>
            </template>

            <template if:true={errorMessage}>
                <p class="slds-text-color_error slds-m-bottom_small">{errorMessage}</p>
            </template>

            <div class="action-footer">
                <div class="action-footer__primary">
                    <lightning-button
                        label={submitLabel}
                        variant="brand"
                        disabled={submitDisabled}
                        onclick={handleSubmit}
                        class="primary-button">
                    </lightning-button>
                </div>
                <button class="cancel-link" type="button" onclick={handleCancel}>Cancel</button>
            </div>
        </template>

        <template if:true={isDone}>
            <div class="success-state">
                <lightning-icon icon-name="utility:success" variant="success" size="large"></lightning-icon>
                <h2 class="slds-text-heading_medium">Extraction Started</h2>
                <p class="slds-text-body_regular slds-text-color_weak">
                    The source documents are being processed. Open the RFP record to review results when ready.
                </p>
                <lightning-button label="Open RFP" variant="brand" onclick={handleOpenRFP}></lightning-button>
            </div>
        </template>
    </div>
</template>
